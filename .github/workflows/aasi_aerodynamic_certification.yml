name: AASI Aerospace Aerodynamic Certification & V&V 20 Verification

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-quality-and-tests:
    name: Backend Regression Suite (948 Physics & Epistemic Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & AASI SDK
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e sdk/python
          pip install pytest pytest-asyncio httpx

      - name: Run Full Pytest Suite
        run: |
          pytest -v

  frontend-build-and-typecheck:
    name: Frontend Build & TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci

      - name: Next.js Production Build
        run: |
          npm --prefix frontend run build

  aerodynamic-certification:
    name: ASME V&V 20 Certification & Cryptographic Audit
    needs: [backend-quality-and-tests, frontend-build-and-typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & AASI SDK
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e sdk/python

      - name: Launch AASI Verification Platform
        env:
          AASI_SECRET_KEY: "ci-ephemeral-secret-key-for-automated-verification-test"
        run: |
          nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          sleep 6

      - name: Verify Backend Health & Model Zoo
        run: |
          curl -f http://127.0.0.1:8000/api/health || exit 1

      - name: Run ASME V&V 20 Benchmark Verification (NASA LTPT NACA 0012)
        run: |
          aasi cert verify --geometry "NACA 0012" --threshold 0.05

      - name: Run ASME V&V 20 Transonic Benchmark Verification (AGARD 138 RAE 2822)
        run: |
          aasi cert verify --geometry "RAE 2822" --threshold 0.05

      - name: Verify Cryptographic SHA-256 Audit Trail
        run: |
          aasi audit verify --org-id "default"

      - name: Generate Mission Polar Sweep
        run: |
          aasi polar --airfoil "RAE 2822" --reynolds 6500000 --mach 0.729
