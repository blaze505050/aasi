[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aasi-orbital-gnc"
version = "2.0.0"
description = "AASI 6-DOF Reinforcement Meta-Learning Orbital Docking & NavIC RODP Filter"
authors = [{ name = "AASI Sovereign Architecture Team" }]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "pydantic>=2.0.0",
]
readme = "README.md"
requires-python = ">=3.10"
